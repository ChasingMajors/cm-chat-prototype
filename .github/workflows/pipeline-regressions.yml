name: Pipeline regressions
on:
  push:
    branches: [main]
    paths: ['command-center/**', 'scripts/**', 'package.json', '.github/workflows/pipeline-regressions.yml']
  pull_request:
    paths: ['command-center/**', 'scripts/**', 'package.json', '.github/workflows/pipeline-regressions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify imports, publication, queue recovery and frontend guards
        run: npm run test:publish
