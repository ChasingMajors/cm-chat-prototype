name: Pipeline regressions
on:
  push:
    branches: [main]
    paths: ['command-center/**', 'print-run-lab/**', 'data/print-run-lab/**', 'scripts/**', 'package.json', '.github/workflows/pipeline-regressions.yml']
  pull_request:
    paths: ['command-center/**', 'print-run-lab/**', 'data/print-run-lab/**', 'scripts/**', 'package.json', '.github/workflows/pipeline-regressions.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify imports, publication, queue recovery and frontend guards
        run: npm run test:publish
      - name: Verify publish monitoring and failure alerts
        run: npm run test:publish-monitor
      - name: Verify Print Run Lab calculations and extraction
        run: npm run test:print-run
      - name: Verify multi-line odds header folding and systemic mismatch warning
        run: npm run test:print-run-header
      - name: Verify public reading and owner-only authoring
        run: npm run test:print-run-access
      - name: Verify atomic Lab publishing and generated model parity
        run: npm run test:print-run-publish
      - name: Verify offline owner calibration comparisons
        run: npm run test:print-run-calibrate
