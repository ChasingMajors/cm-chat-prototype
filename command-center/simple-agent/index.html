<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f5" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="CM Sentinel" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/sentinel-icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icons/sentinel-icon.svg" />
  <title>CM Sentinel</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --text: #111111;
      --muted: #555555;
      --border: #d7d7d7;
      --blue: #0b63ce;
      --green: #0f8f3d;
      --yellow: #9a6a00;
      --red: #b42318;
      --fade: 180ms ease;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.45;
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 48px auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 14px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    p, label, input, button, li {
      font-size: 14px;
    }

    .muted {
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 16px;
    }

    button {
      border: 1px solid #1f2937;
      border-radius: 4px;
      background: #ffffff;
      color: #111111;
      cursor: pointer;
      min-height: 38px;
      padding: 8px 14px;
      font-weight: 700;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }


    .status-line {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      margin-top: 10px;
      min-height: 22px;
    }

    .intro-actions {
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity var(--fade), transform var(--fade);
    }

    .intro-actions.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
      animation: softPulse 1.4s ease-in-out infinite;
    }

    .dot.ready { background: var(--green); }
    .dot.working { background: var(--yellow); }
    .dot.issue { background: var(--red); }

    .typing::after {
      content: "|";
      display: inline-block;
      margin-left: 2px;
      color: var(--muted);
      animation: caretBlink 800ms steps(1, end) infinite;
    }

    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .summary {
      border-left: 4px solid var(--blue);
      padding-left: 12px;
      margin-top: 12px;
      white-space: pre-line;
    }

    .hidden { display: none; }

    .list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      background: #ffffff;
    }

    .item-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .source-product {
      border-top: 1px solid var(--border);
      margin-top: 10px;
      padding-top: 10px;
    }

    .source-product:first-of-type {
      border-top: 0;
      margin-top: 0;
      padding-top: 0;
    }

    .tag {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      margin: 4px 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: space-between;
      margin-top: 10px;
    }

    .item-actions-left {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    button.ignore {
      border-color: var(--border);
      color: var(--muted);
      margin-left: auto;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      align-items: center;
      background: rgba(0, 0, 0, 0.48);
      display: none;
      justify-content: center;
      padding: 18px;
      z-index: 20;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 18px;
      width: min(820px, 100%);
    }

    .modal-top {
      align-items: flex-start;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-close {
      min-height: 32px;
      padding: 4px 10px;
    }

    .preview-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 14px;
    }

    .preview-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .preview-row {
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 8px;
      grid-template-columns: 54px 1fr 1fr;
      padding: 7px 0;
    }

    .preview-row em {
      color: var(--muted);
      font-style: normal;
      text-align: right;
    }

    .guardrail {
      background: #f7f7f7;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      margin-top: 14px;
      padding: 10px;
    }

    .queue-note {
      border-left: 4px solid var(--yellow);
      padding-left: 12px;
    }

    a { color: var(--blue); }

    @media (max-width: 640px) {
      main {
        width: calc(100% - 20px);
        margin: 20px auto;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .preview-grid {
        grid-template-columns: 1fr;
      }

      .preview-row {
        grid-template-columns: 42px 1fr;
      }

      .preview-row em {
        grid-column: 2;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1 id="welcomeText" aria-label="Welcome ChasingMajors Team."></h1>
      <p id="readyText" class="muted" aria-label="Ready to run an Agent Cycle?"></p>
      <div id="introActions" class="actions intro-actions">
        <button id="yesBtn" class="primary" type="button">Yes</button>
        <button id="noBtn" type="button">No</button>
      </div>
      <div id="runStatus" class="status-line">
        <span class="dot"></span>
        <span id="waitingText">Waiting</span>
      </div>
    </section>

    <section id="jsonQueueCard" class="card hidden">
      <h2>JSON Holding Queue</h2>
      <p id="jsonQueueSummary" class="queue-note"></p>
      <div id="jsonQueuePrompt" class="actions">
        <button id="showJsonQueueBtn" class="primary" type="button">Yes</button>
      </div>
      <div id="jsonQueueList" class="list hidden"></div>
    </section>

    <section id="resultsCard" class="card hidden">
      <h2>Agent Cycle Results</h2>
      <div id="summary" class="summary"></div>
      <div class="actions">
        <button id="showChecklistsBtn" type="button">List Missing Checklist Product(s)</button>
        <button id="showPrvBtn" type="button">List Missing Print Run Product(s)</button>
      </div>
    </section>

    <section id="checklistCard" class="card hidden">
      <h2>Missing Checklist Product(s)</h2>
      <div id="checklistList" class="list"></div>
    </section>

    <section id="prvCard" class="card hidden">
      <h2>Missing Print Run Product(s)</h2>
      <div id="prvList" class="list"></div>
    </section>
  </main>

  <div id="previewModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="previewModalTitle">
    <div class="modal">
      <div class="modal-top">
        <div>
          <h2 id="previewModalTitle">Import Preview</h2>
          <p id="previewModalSubtitle" class="muted"></p>
        </div>
        <button id="previewModalClose" class="modal-close" type="button">Close</button>
      </div>
      <div id="previewModalBody"></div>
    </div>
  </div>

  <script>
    (function () {
      const VERSION = "simple-agent-coverage-v5-2026-10-17";
      const DEFAULT_OPERATOR_URL = "https://script.google.com/macros/s/AKfycbyH90r_uVKKVyEUPAzQv65PlMC7j6LGYxq3s2HWAjBwkpTsLOo8U7KPhBWCD-6ExRjc/exec";
      const OPERATOR_WRITE_KEY = "cm_command_center_operator_write_key_v1";
      const JSON_RETRY_QUEUE_KEY = "cm_simple_agent_json_retry_queue_v1";
      const IGNORED_PRODUCTS_KEY = "cm_simple_agent_ignored_products_v1";
      const JSON_RETRY_DELAY_MS = 30000;
      const JSON_RETRY_LIMIT = 5;
      const JSON_RETRY_DECISION_ATTEMPT = 3;
      const APP_TEST_POLL_MS = 15000;
      const APP_TEST_POLL_LIMIT = 24;
      const SPORTS = ["baseball", "basketball", "football", "hockey", "soccer"];

      const state = {
        checklist: [],
        prv: [],
        prvScan: null,
        ignoredProducts: readIgnoredProducts(),
        statusTimer: null,
        lastWriteData: null,
        activeQueuedItem: null,
        publishTimer: null,
        publishInFlight: false,
        lastPublishError: "",
        appTestTimer: null,
        jsonRetryQueue: [],
        agentMemory: null,
        jsonQueueShared: false,
        jsonQueueLoaded: false,
        jsonQueueNeedsAuth: false,
        jsonQueueLocalPending: 0,
        jsonQueueError: ""
      };

      const els = {
        yesBtn: document.getElementById("yesBtn"),
        noBtn: document.getElementById("noBtn"),
        welcomeText: document.getElementById("welcomeText"),
        readyText: document.getElementById("readyText"),
        introActions: document.getElementById("introActions"),
        runStatus: document.getElementById("runStatus"),
        waitingText: document.getElementById("waitingText"),
        resultsCard: document.getElementById("resultsCard"),
        summary: document.getElementById("summary"),
        showChecklistsBtn: document.getElementById("showChecklistsBtn"),
        showPrvBtn: document.getElementById("showPrvBtn"),
        jsonQueueCard: document.getElementById("jsonQueueCard"),
        jsonQueueSummary: document.getElementById("jsonQueueSummary"),
        jsonQueuePrompt: document.getElementById("jsonQueuePrompt"),
        showJsonQueueBtn: document.getElementById("showJsonQueueBtn"),
        jsonQueueList: document.getElementById("jsonQueueList"),
        checklistCard: document.getElementById("checklistCard"),
        prvCard: document.getElementById("prvCard"),
        checklistList: document.getElementById("checklistList"),
        prvList: document.getElementById("prvList"),
        previewModal: document.getElementById("previewModal"),
        previewModalTitle: document.getElementById("previewModalTitle"),
        previewModalSubtitle: document.getElementById("previewModalSubtitle"),
        previewModalBody: document.getElementById("previewModalBody"),
        previewModalClose: document.getElementById("previewModalClose")
      };

      function setStatus(node, kind, text) {
        const dot = node.querySelector(".dot");
        const label = node.querySelector("span:last-child");
        dot.className = "dot " + (kind || "");
        label.textContent = text;
      }

      function stopTimedStatus() {
        if (state.statusTimer) {
          clearInterval(state.statusTimer);
          state.statusTimer = null;
        }
      }

      function setTimedStatus(kind, text) {
        stopTimedStatus();
        let seconds = 0;
        setStatus(els.runStatus, kind, text + " (0s)");
        state.statusTimer = setInterval(() => {
          seconds += 1;
          setStatus(els.runStatus, kind, text + " (" + seconds + "s)");
        }, 1000);
      }

      function withQuery(endpoint, params) {
        const query = Object.keys(params).map(key => {
          return encodeURIComponent(key) + "=" + encodeURIComponent(params[key]);
        }).join("&");
        return endpoint + (endpoint.indexOf("?") > -1 ? "&" : "?") + query;
      }

      async function postOperatorJson(endpoint, payload, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs || 60000);
        try {
          // Apps Script redirects to a temporary response URL. Avoid reusing a
          // cached redirect after a deployment or an earlier scan.
          const requestUrl = withQuery(endpoint, { requestId: Date.now() + "-" + Math.random().toString(36).slice(2) });
          const response = await fetch(requestUrl, {
            method: "POST",
            cache: "no-store",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload || {}),
            signal: controller.signal
          });
          if (!response.ok) throw new Error(response.status + " " + response.statusText);
          return await response.json();
        } finally {
          clearTimeout(timer);
        }
      }

      async function postOperatorStep(action, payload, timeoutMs, stepLabel) {
        const readOnly = ["health", "sourceWatch", "prvSourceWatch"].includes(action) || ["publishImportedChecklist", "publishPrvVaultStaticData"].includes(action) && !!(payload && payload.job_id);
        const deadline = Date.now() + (timeoutMs || 60000);
        for (let attempt = 0; attempt < (readOnly ? 2 : 1); attempt++) {
          try {
            return await postOperatorJson(DEFAULT_OPERATOR_URL, Object.assign({ action: action }, payload || {}), Math.max(1, deadline - Date.now()));
          } catch (err) {
            const message = err && err.message ? err.message : String(err || "Unknown error");
            const transient = /^(404|410|429|500|502|503|504)\b/.test(message) || /Failed to fetch|NetworkError|Load failed/.test(message);
            if (readOnly && attempt === 0 && transient && deadline - Date.now() > 1000) continue;
            throw new Error(stepLabel + " failed. " + explainBackendError(message));
          }
        }
      }

      function explainBackendError(message) {
        const text = String(message || "").trim();
        if (text.indexOf("404") === 0 || text.includes(" 404")) {
          return "The scan request returned HTTP 404. This can be an Apps Script response redirect failure; it does not by itself mean the deployment URL changed. Please try the Agent Cycle again if it persists.";
        }
        if (text.includes("Failed to fetch") || text.includes("NetworkError") || text.includes("Load failed")) {
          return "The browser could not reach the Operator Backend. Check internet connection and Apps Script deployment access.";
        }
        if (text.includes("Timed out")) {
          return text + " The backend may still be working, but this page stopped waiting.";
        }
        return text || "Unknown backend response.";
      }

      function readOperatorKey() {
        try {
          return String(sessionStorage.getItem(OPERATOR_WRITE_KEY) || "").trim();
        } catch (err) {
          return "";
        }
      }

      function clearLegacyPersistentOperatorKey() {
        try {
          localStorage.removeItem(OPERATOR_WRITE_KEY);
        } catch (err) {}
      }

      function saveOperatorKey(key) {
        try {
          sessionStorage.setItem(OPERATOR_WRITE_KEY, String(key || "").trim());
          loadSharedJsonRetryQueue().then(() => renderJsonRetryNotice());
        } catch (err) {}
      }

      function requireOperatorKey() {
        let key = readOperatorKey();
        if (key) return key;
        key = window.prompt("Enter admin write key");
        if (!key) return "";
        saveOperatorKey(key);
        return String(key).trim();
      }

      async function fetchJson(url, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs || 60000);
        try {
          const response = await fetch(url, { cache: "no-store", signal: controller.signal });
          if (!response.ok) throw new Error(response.status + " " + response.statusText);
          return await response.json();
        } finally {
          clearTimeout(timer);
        }
      }

      async function checkOperator(endpoint) {
        const health = await postOperatorStep("health", {}, 30000, "Operator Backend health check");
        if (!health || !health.ok || health.service !== "cm_command_center_operator") {
          throw new Error("This is not the Command Center Operator Backend.");
        }
        return health;
      }

      function actionableItems(data) {
        return (Array.isArray(data && data.items) ? data.items : []).filter(item => {
          return item && (
            item.status === "missing" ||
            item.status === "needs_review" ||
            item.status === "possible_update" ||
            item.status === "known_issue"
          );
        });
      }

      function missingItems(data) {
        return actionableItems(data).filter(item => item.status === "missing" && !isIgnoredProduct(item));
      }

      function actionablePrvItems(data) {
        return actionableItems(data).filter(item => {
          return !isIgnoredProduct(item) && (
            item.status === "missing" ||
            item.status === "needs_review" ||
            item.status === "possible_update" ||
            item.status === "known_issue"
          );
        });
      }

      function readIgnoredProducts() {
        try {
          const parsed = JSON.parse(localStorage.getItem(IGNORED_PRODUCTS_KEY) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
          return [];
        }
      }

      function writeIgnoredProducts(items) {
        try {
          localStorage.setItem(IGNORED_PRODUCTS_KEY, JSON.stringify(items || []));
        } catch (err) {}
      }

      function productIgnoreKey(item) {
        return [
          String(item && item.sport || "").toLowerCase(),
          String(item && (item.source_url || item.url || "") || "").toLowerCase(),
          String(item && (item.matched_name || item.title || item.product || "") || "").toLowerCase()
        ].join("|");
      }

      function isIgnoredProduct(item) {
        return state.ignoredProducts.includes(productIgnoreKey(item));
      }

      function ignoreProduct(type, index) {
        const list = type === "prv" ? state.prv : state.checklist;
        const item = list[Number(index)];
        if (!item) return;
        const key = productIgnoreKey(item);
        if (key && !state.ignoredProducts.includes(key)) {
          state.ignoredProducts.push(key);
          writeIgnoredProducts(state.ignoredProducts);
        }
        state.checklist = state.checklist.filter(candidate => !isIgnoredProduct(candidate));
        state.prv = state.prv.filter(candidate => !isIgnoredProduct(candidate));
        renderDiscoverySummary("Ignored products are hidden from future scans on this device.");
      }

      function sportCounts(items) {
        const counts = {};
        SPORTS.forEach(sport => counts[sport] = 0);
        items.forEach(item => {
          const sport = String(item.sport || "").toLowerCase();
          if (counts[sport] !== undefined) counts[sport] += 1;
        });
        return counts;
      }

      function formatNumber(value) {
        const number = Number(value || 0);
        return Number.isFinite(number) ? number.toLocaleString() : "0";
      }

      function titleCase(value) {
        return String(value || "").replace(/_/g, " ").replace(/\b\w/g, char => char.toUpperCase());
      }

      function countSentence(counts) {
        const parts = SPORTS.filter(sport => counts[sport]).map(sport => {
          return counts[sport] + " " + sport;
        });
        if (!parts.length) return "0 products";
        if (parts.length === 1) return parts[0] + " product(s)";
        return parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1] + " product(s)";
      }

      function queueKey(item) {
        return [item && item.kind || "checklist", item && item.sport || "", item && item.bucket || "", item && item.code || ""].join("|");
      }

      function mergeJsonRetryQueues(primary, secondary) {
        const merged = [], positions = new Map();
        [primary || [], secondary || []].forEach(queue => {
          (Array.isArray(queue) ? queue : []).forEach(item => {
            const key = queueKey(item);
            if (!positions.has(key)) { positions.set(key,merged.length); merged.push(item); return; }
            const index = positions.get(key), existing = merged[index];
            if ((item.updated_at || item.queued_at || "") > (existing.updated_at || existing.queued_at || "")) merged[index] = Object.assign({},existing,item);
          });
        });
        return merged.slice(0,50);
      }

      function queuedWriteData(item) {
        return {
          target_bucket: item.bucket || "",
          target_tool: item.kind || "checklist",
          product: {
            display_name: item.product || item.code || "Checklist JSON publish",
            code: item.code || "",
            sport: item.sport || "",
            target_bucket: item.bucket || "",
            year: item.bucket || ""
          }
        };
      }

      function readLocalJsonRetryQueue() {
        try {
          const parsed = JSON.parse(localStorage.getItem(JSON_RETRY_QUEUE_KEY) || "[]");
          return Array.isArray(parsed) ? parsed : [];
        } catch (err) {
          return [];
        }
      }

      function writeLocalJsonRetryQueue(queue) {
        try {
          localStorage.setItem(JSON_RETRY_QUEUE_KEY, JSON.stringify(queue || []));
        } catch (err) {}
      }

      function blankAgentMemory() {
        return {
          schema: "agent_memory_v1",
          agent_actions: [],
          activity_log: [],
          tasks: [],
          source_ignores: {},
          json_publish_retry_queue: []
        };
      }

      async function loadSharedJsonRetryQueue() {
        const key = readOperatorKey();
        const localQueue = readLocalJsonRetryQueue();
        if (!key) {
          state.jsonRetryQueue = [];
          state.jsonQueueShared = false;
          state.jsonQueueLoaded = true;
          state.jsonQueueNeedsAuth = true;
          state.jsonQueueLocalPending = localQueue.length;
          state.jsonQueueError = "";
          return state.jsonRetryQueue;
        }

        try {
          const data = await postOperatorJson(DEFAULT_OPERATOR_URL, {
            action: "loadAgentMemory",
            key: key
          }, 60000);
          if (!data || !data.ok) throw new Error(data && data.error || "Backend did not confirm the shared queue load.");
          const memory = data.memory && data.memory.schema === "agent_memory_v1" ? data.memory : blankAgentMemory();
          const serverQueue = Array.isArray(memory.json_publish_retry_queue) ? memory.json_publish_retry_queue : [];
          const merged = mergeJsonRetryQueues(serverQueue, localQueue);
          memory.json_publish_retry_queue = merged;
          state.agentMemory = memory;
          state.jsonRetryQueue = merged;
          state.jsonQueueShared = true;
          state.jsonQueueLoaded = true;
          state.jsonQueueNeedsAuth = false;
          state.jsonQueueLocalPending = 0;
          state.jsonQueueError = "";
          writeLocalJsonRetryQueue([]);
          if (merged.length !== serverQueue.length || localQueue.some(item => !serverQueue.some(existing => queueKey(existing) === queueKey(item)))) {
            await saveSharedJsonRetryQueue(merged, false, true);
          }
          return merged;
        } catch (err) {
          state.jsonRetryQueue = [];
          state.jsonQueueShared = false;
          state.jsonQueueLoaded = true;
          state.jsonQueueNeedsAuth = false;
          state.jsonQueueLocalPending = localQueue.length;
          state.jsonQueueError = explainBackendError(err && err.message ? err.message : String(err));
          return state.jsonRetryQueue;
        }
      }

      async function saveSharedJsonRetryQueue(queue, showFallbackNotice, replaceExact) {
        const nextQueue = Array.isArray(queue) ? queue.slice(0, 50) : [];
        state.jsonRetryQueue = nextQueue;
        writeLocalJsonRetryQueue(nextQueue);
        const key = readOperatorKey();
        if (!key) {
          state.jsonQueueShared = false;
          writeLocalJsonRetryQueue(nextQueue);
          return false;
        }

        try {
          let memory = state.agentMemory && state.agentMemory.schema === "agent_memory_v1"
            ? state.agentMemory
            : null;
          if (!memory) {
            const data = await postOperatorJson(DEFAULT_OPERATOR_URL, {
              action: "loadAgentMemory",
              key: key
            }, 60000);
            memory = data && data.memory && data.memory.schema === "agent_memory_v1" ? data.memory : blankAgentMemory();
          }
          memory.json_publish_retry_queue = replaceExact ? nextQueue : mergeJsonRetryQueues(nextQueue, memory.json_publish_retry_queue || []);
          memory.activity_log = Array.isArray(memory.activity_log) ? memory.activity_log : [];
          memory.saved_at = new Date().toISOString();
          const saved = await postOperatorJson(DEFAULT_OPERATOR_URL, {
            action: "saveAgentMemory",
            memory: memory,
            key: key
          }, 60000);
          if (!saved || !saved.ok) throw new Error(saved && saved.error || "Backend did not confirm the shared queue save.");
          state.agentMemory = memory;
          state.jsonRetryQueue = memory.json_publish_retry_queue;
          writeLocalJsonRetryQueue([]);
          state.jsonQueueShared = true;
          return true;
        } catch (err) {
          state.jsonQueueShared = false;
          if (showFallbackNotice) {
            openPreviewModal("Shared queue save failed", "JSON Holding Queue", '<div class="guardrail">This item was not added to the shared queue because Sentinel could not update backend memory. ' + escapeHtml(explainBackendError(err && err.message ? err.message : String(err))) + '</div>');
          }
          return false;
        }
      }

      function readJsonRetryQueue() {
        return Array.isArray(state.jsonRetryQueue) ? state.jsonRetryQueue : [];
      }

      async function writeJsonRetryQueue(queue, showFallbackNotice, replaceExact) {
        return await saveSharedJsonRetryQueue(queue, showFallbackNotice, replaceExact);
      }

      async function removeJsonRetryQueueItem(item) {
        const key = queueKey(item);
        await writeJsonRetryQueue(readJsonRetryQueue().filter(existing => queueKey(existing) !== key), false, true);
        renderJsonRetryNotice();
        if (readJsonRetryQueue().length) renderJsonRetryList();
      }

      function renderJsonRetryNotice() {
        const queue = readJsonRetryQueue();
        if (state.jsonQueueNeedsAuth) {
          els.jsonQueueSummary.textContent = state.jsonQueueLocalPending
            ? "This device has " + state.jsonQueueLocalPending + " local JSON retry item(s) that are not synced. Enter the admin key to move them into the shared queue."
            : "Enter the admin key to load the shared JSON holding queue.";
          els.showJsonQueueBtn.textContent = state.jsonQueueLocalPending ? "Sync Shared Queue" : "Load Shared Queue";
          els.jsonQueueCard.classList.remove("hidden");
          els.jsonQueuePrompt.classList.remove("hidden");
          els.jsonQueueList.classList.add("hidden");
          els.jsonQueueList.innerHTML = "";
          return;
        }

        if (state.jsonQueueError) {
          els.jsonQueueSummary.textContent = "Shared JSON queue could not be loaded. " + state.jsonQueueError;
          els.showJsonQueueBtn.textContent = "Retry Shared Queue";
          els.jsonQueueCard.classList.remove("hidden");
          els.jsonQueuePrompt.classList.remove("hidden");
          els.jsonQueueList.classList.add("hidden");
          els.jsonQueueList.innerHTML = "";
          return;
        }

        if (!queue.length) {
          els.jsonQueueCard.classList.add("hidden");
          els.jsonQueueList.classList.add("hidden");
          els.jsonQueueList.innerHTML = "";
          return;
        }

        const scope = state.jsonQueueShared ? "shared queue" : "this device only";
        els.jsonQueueSummary.textContent = "You have " + queue.length + " JSON publish job(s) needing upload or verification in the " + scope + ". Proceed with a reattempt?";
        els.showJsonQueueBtn.textContent = "Yes";
        els.jsonQueueCard.classList.remove("hidden");
        els.jsonQueuePrompt.classList.remove("hidden");
      }

      function renderJsonRetryList() {
        const queue = readJsonRetryQueue();
        els.jsonQueuePrompt.classList.add("hidden");
        els.jsonQueueList.classList.remove("hidden");
        els.jsonQueueList.innerHTML = queue.map((item, index) => `
          <div class="item">
            <h3>JSON PUBLISH REATTEMPT</h3>
            <div class="item-title">${escapeHtml(item.product || item.code || "Checklist JSON publish")}</div>
            <div class="muted">${escapeHtml(item.reason || "Queued for future JSON publish retry.")}</div>
            <span class="tag">${escapeHtml(item.sport || "unknown sport")}</span>
            <span class="tag">Bucket: ${escapeHtml(item.bucket || "")}</span>
            <span class="tag">Code: ${escapeHtml(item.code || "")}</span>
            <div class="item-actions">
              <button class="primary" type="button" data-update-json-key="${escapeHtml(queueKey(item))}">${item.job_id ? "Resume / Verify" : "Update JSON"}</button>
            </div>
          </div>
        `).join("");
      }

      async function handleJsonQueuePrompt() {
        if (state.jsonQueueNeedsAuth || state.jsonQueueError) {
          const key = requireOperatorKey();
          if (!key) return;
          await loadSharedJsonRetryQueue();
          renderJsonRetryNotice();
          if (!state.jsonQueueNeedsAuth && !state.jsonQueueError && readJsonRetryQueue().length) {
            renderJsonRetryList();
          }
          return;
        }
        renderJsonRetryList();
      }

      function renderDiscoverySummary(note) {
        const checklistCounts = sportCounts(state.checklist);
        const prvCounts = sportCounts(state.prv);
        const checklistTotal = state.checklist.length;
        const prvBlocked = state.prv.filter(item => item.status === "known_issue").length;
        const prvTotal = state.prv.length;
        const scan = state.prvScan;
        const prvScanDetail = scan ? "\nPrint-run scan: " + Number(scan.fetched_count || 0) + " supported source articles checked; " + Number(scan.summary && scan.summary.covered || 0) + " verified against parsed source rows; " + prvBlocked + " blocked source articles need attention. " + (scan.archive_scan ? "Checked " + Number(scan.archive_scan.pages_checked || 0) + " archive pages. " + (scan.archive_scan.archive_complete ? "Archive sweep reached the end." : "Older posts continue next cycle.") : "Checks the latest 20 source posts.") : "";

        els.summary.textContent =
          "I found " + checklistTotal + " missing checklist product(s) and " + prvTotal + " print-run source article(s) needing review or access.\n" +
          "Checklist: " + countSentence(checklistCounts) + " missing from the checklist tables.\n" +
          "Print Runs: " + countSentence(prvCounts) + " found for review, including blocked sources." + prvScanDetail +
          (note ? "\n" + note : "");

        renderList(els.checklistList, state.checklist, "NEW CHECKLIST FOUND - SOURCE IMPORT", "checklist");
        renderList(els.prvList, state.prv, "NEW PRINT RUN FOUND - PRV REVIEW", "prv");
        els.resultsCard.classList.remove("hidden");
      }

      function titleFor(item) {
        return item.matched_name || item.title || item.product || "Untitled product";
      }

      function sourceFor(item) {
        return item.source_url || item.url || "";
      }

      function previewButtonFor(item, type, index) {
        if (!sourceFor(item)) return "";
        const label = type === "prv" ? "PRV Preview" : "Preview Ready";
        return '<button type="button" data-preview-type="' + escapeHtml(type) + '" data-preview-index="' + escapeHtml(index) + '">' + label + '</button>';
      }

      function sourceHostLabel(url) {
        try {
          return new URL(url).hostname.replace(/^www\./, "");
        } catch (err) {
          return "source";
        }
      }

      function groupItemsBySource(items) {
        const groups = [];
        const byKey = {};
        (items || []).forEach((item, index) => {
          const source = sourceFor(item) || "no-source-" + index;
          if (!byKey[source]) {
            byKey[source] = {
              source: source,
              items: []
            };
            groups.push(byKey[source]);
          }
          byKey[source].items.push({ item: item, index: index });
        });
        return groups;
      }

      function renderPrvList(node, items, heading) {
        if (!items.length) {
          node.innerHTML = '<div class="item"><div class="item-title">No pending print-run sources found in this scan.</div><div class="muted">See the scan summary for articles checked and existing Vault coverage.</div></div>';
          return;
        }

        node.innerHTML = groupItemsBySource(items).map(group => {
          const grouped = group.items.length > 1;
          const source = group.source.indexOf("no-source-") === 0 ? "" : group.source;
          const groupHeader = grouped
            ? '<div class="muted">Multiple PRV products found from ' + escapeHtml(sourceHostLabel(source)) + '.</div>'
            : "";
          return `
            <div class="item">
              <h3>${group.items.every(entry => entry.item.status === "known_issue") ? "PRINT RUN SOURCE FOUND - ACCESS BLOCKED" : heading}</h3>
              ${groupHeader}
              ${group.items.map(entry => {
                const item = entry.item;
                const sourceUrl = sourceFor(item);
                return `
                  <div class="source-product">
                    <div class="item-title">${escapeHtml(titleFor(item))}</div>
                    <div class="muted">${escapeHtml(item.blocked_reason || item.reason || item.recommended_action || "Needs review before any database write.")}</div>
                    <span class="tag">${escapeHtml(item.sport || "unknown sport")}</span>
                    <span class="tag">${escapeHtml(item.status || "review")}</span>
                    <div class="item-actions">
                      <div class="item-actions-left">
                        ${previewButtonFor(item, "prv", entry.index)}
                        ${sourceUrl ? `<a href="${escapeHtml(sourceUrl)}" target="_blank" rel="noopener noreferrer">Source</a>` : ""}
                      </div>
                      <button class="ignore" type="button" data-ignore-type="prv" data-ignore-index="${escapeHtml(entry.index)}">Ignore</button>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          `;
        }).join("");
      }

      function renderList(node, items, heading, type) {
        if (type === "prv") {
          renderPrvList(node, items, heading);
          return;
        }

        if (!items.length) {
          node.innerHTML = '<div class="item"><div class="item-title">No missing products found.</div><div class="muted">This lane is clear.</div></div>';
          return;
        }

        node.innerHTML = items.map((item, index) => {
          const source = sourceFor(item);
          return `
            <div class="item">
              <h3>${heading}</h3>
              <div class="item-title">${escapeHtml(titleFor(item))}</div>
              <div class="muted">${escapeHtml(item.blocked_reason || item.reason || item.recommended_action || "Needs review before any database write.")}</div>
              <span class="tag">${escapeHtml(item.sport || "unknown sport")}</span>
              <span class="tag">${escapeHtml(item.status || "review")}</span>
              <div class="item-actions">
                <div class="item-actions-left">
                  ${previewButtonFor(item, type, index)}
                  ${source ? `<a href="${escapeHtml(source)}" target="_blank" rel="noopener noreferrer">Source</a>` : ""}
                </div>
                <button class="ignore" type="button" data-ignore-type="${escapeHtml(type)}" data-ignore-index="${escapeHtml(index)}">Ignore</button>
              </div>
            </div>
          `;
        }).join("");
      }

      function openPreviewModal(title, subtitle, bodyHtml) {
        els.previewModalTitle.textContent = title || "Import Preview";
        els.previewModalSubtitle.textContent = subtitle || "";
        els.previewModalBody.innerHTML = bodyHtml || "";
        els.previewModal.classList.add("open");
      }

      function closePreviewModal() {
        els.previewModal.classList.remove("open");
      }

      function renderPreviewRows(rows, type) {
        if (!rows.length) return '<p class="muted">No sample rows parsed.</p>';
        return rows.map(row => {
          if (type === "prv") {
            const printRun = row.printRun ? "~" + formatNumber(row.printRun) : row.serial_no || "";
            return '<div class="preview-row"><strong>' + escapeHtml(row.setType || "") + '</strong><span>' + escapeHtml(row.setLine || row.name || "") + '</span><em>' + escapeHtml(printRun) + '</em></div>';
          }
          return '<div class="preview-row"><strong>' + escapeHtml(row.card_no || "") + '</strong><span>' + escapeHtml(row.player || row.name || "") + '</span><em>' + escapeHtml(row.team || "") + '</em></div>';
        }).join("");
      }

      function renderPreviewParallels(rows) {
        if (!rows.length) return '<p class="muted">No sample parallels parsed.</p>';
        return rows.map(row => {
          return '<div class="preview-row"><strong>' + escapeHtml(row.parallel_name || row.name || "") + '</strong><span>' + escapeHtml(row.applies_to_subset || row.subset || "") + '</span><em>' + escapeHtml(row.serial_no || row.printRun || "") + '</em></div>';
        }).join("");
      }

      function renderPrvProductChoices(products) {
        const list = Array.isArray(products) ? products : [];
        if (list.length < 2) return "";
        return `
          <h3>Products In This Source</h3>
          <div class="list">
            ${list.map(product => `
              <div class="item">
                <div class="item-title">${escapeHtml(product.display_name || product.code || "Untitled product")}</div>
                <span class="tag">Code: ${escapeHtml(product.code || "")}</span>
                <span class="tag">Sport: ${escapeHtml(titleCase(product.sport || ""))}</span>
                <span class="tag">Year: ${escapeHtml(product.year || "")}</span>
              </div>
            `).join("")}
          </div>
          <div class="guardrail">This source mentions multiple products. Review rows carefully and do not write PRV data until rows are assigned to the correct product.</div>
        `;
      }

      function renderPreviewModal(data, type) {
        if (!data || (!data.ok && data.status !== "preview_ready")) {
          const title = type === "prv" ? "PRV Parser Review Needed" : "Import Preview Failed";
          const detail = data && (data.error || data.reason) || "Unknown backend response.";
          openPreviewModal(title, "Backend did not return a writable preview.", '<div class="guardrail">' + escapeHtml(detail) + '</div>');
          return;
        }

        const product = data.product || {};
        const products = Array.isArray(data.products) ? data.products : [];
        const sampleRows = Array.isArray(data.sample_rows) ? data.sample_rows : [];
        const sampleParallels = Array.isArray(data.sample_parallels) ? data.sample_parallels : [];
        const hasRows = Number(data.row_count || 0) > 0;
        const title = type === "prv"
          ? products.length > 1 ? "Multiple PRV Products Found" : hasRows ? "PRV Source Preview" : "PRV Parser Review Needed"
          : "Import Preview";
        const rightColumn = type === "prv"
          ? '<p>' + escapeHtml(hasRows ? "Review these rows before writing print-run data." : "Parser review is needed before this can write PRV sheet data.") + '</p>'
          : renderPreviewParallels(sampleParallels);
        const checklistMeta = type === "checklist"
          ? '<span class="tag">Parallels: ' + formatNumber(data.parallel_count || 0) + '</span><span class="tag">Target: ' + escapeHtml(product.target_bucket || "") + '</span>'
          : "";
        const writeLabel = type === "prv" ? "Write PRV Temp Data" : "Write to Google Sheet";
        const guardrail = type === "prv"
          ? products.length > 1
            ? "This trial page found multiple PRV products in one source. Product-specific PRV write is intentionally blocked until rows are split by product."
            : "Review the sample rows before writing. A single-product source can be imported with recovery protection, then published as a background job."
          : "Review the sample rows before writing. This action replaces this product’s rows exactly, including removing obsolete rows, and keeps a recovery snapshot. Unrelated products are preserved.";
        const writeButton = type === "prv" && !data.multi_product && products.length <= 1 && data.status === "preview_ready" && data.source_url
          ? '<button class="primary" type="button" data-write-prv-source="' + escapeHtml(data.source_url) + '" data-write-prv-sport="' + escapeHtml(product.sport || "") + '">Write Print Run Data</button>'
          : type === "checklist" && data.status === "preview_ready" && data.source_url
          ? '<button class="primary" type="button" data-write-checklist-source="' + escapeHtml(data.source_url || "") + '" data-write-checklist-sport="' + escapeHtml(product.sport || "") + '">Write to Google Sheet</button>'
          : '<button type="button" disabled>' + escapeHtml(writeLabel) + '</button>';

        openPreviewModal(title, product.display_name || "Untitled product", `
          <div class="preview-meta">
            <span class="tag">${escapeHtml(String(data.status || "preview").toUpperCase())}</span>
            <span class="tag">Code: ${escapeHtml(product.code || "")}</span>
            <span class="tag">Sport: ${escapeHtml(titleCase(product.sport || ""))}</span>
            <span class="tag">Year: ${escapeHtml(product.year || "")}</span>
            <span class="tag">Rows: ${formatNumber(data.row_count || 0)}</span>
            ${checklistMeta}
          </div>
          ${type === "prv" ? renderPrvProductChoices(products) : ""}
          <div class="preview-grid">
            <div>
              <h3>${type === "prv" ? "Sample PRV Rows" : "Sample Rows"}</h3>
              ${renderPreviewRows(sampleRows, type)}
            </div>
            <div>
              <h3>${type === "prv" ? "Next Step" : "Sample Parallels"}</h3>
              ${rightColumn}
            </div>
          </div>
          <div class="guardrail">${escapeHtml(guardrail)}</div>
          <div class="actions">${writeButton}</div>
        `);
      }

      function renderWriteResult(data) {
        if (!data || !data.ok) {
          const preview = data && data.preview ? data.preview : {};
          const detail = (data && data.error ? data.error : "Unknown backend response.") + (data && data.recovery ? " " + data.recovery : "");
          openPreviewModal("Import needs attention", preview.product && preview.product.display_name ? preview.product.display_name : "Review import and recovery details.", '<div class="guardrail">' + escapeHtml(detail) + '</div>');
          return;
        }

        state.lastWriteData = data;
        const product = data.product || {};
        const validation = data.validation || {};
        const bucket = data.target_bucket || product.target_bucket || product.year || "";
        const canPublish = product.code && product.sport && bucket;
        const publishButton = canPublish
          ? '<button class="primary" type="button" data-publish-json>Publish JSON</button>'
          : '<button type="button" disabled>Publish JSON</button>';
        openPreviewModal("Google Sheet Updated", product.display_name || "Untitled product", `
          <div class="preview-meta">
            <span class="tag">REVIEW</span>
            <span class="tag">Target: ${escapeHtml(data.target_bucket || product.target_bucket || product.year || "")}</span>
            <span class="tag">Product rows: ${formatNumber(validation.product_rows || 0)}</span>
            <span class="tag">Checklist rows: ${formatNumber(validation.checklist_rows || 0)}</span>
            <span class="tag">Parallels: ${formatNumber(validation.parallel_rows || 0)}</span>
            <span class="tag">GitHub publish: Not started</span>
            <span class="tag">GitHub rows: 0</span>
            <span class="tag">GitHub parallels: 0</span>
            <span class="tag">Public rows: 0</span>
            <span class="tag">Public parallels: 0</span>
            <span class="tag">CV: Review</span>
            <span class="tag">ChatBot: Review</span>
          </div>
          <div class="guardrail">Sheet row counts passed validation. Publish JSON saves a background job that commits and verifies the complete release.</div>
          <div class="actions">${publishButton}</div>
        `);
      }

      async function queueFuturePublishRetry(writeData, detail) {
        const product = writeData && writeData.product ? writeData.product : {};
        const key = requireOperatorKey();
        if (!key) {
          openPreviewModal("Admin key needed", product.display_name || product.code || "Checklist JSON publish", '<div class="guardrail">Enter the admin key before adding this product to the shared JSON holding queue.</div>');
          return;
        }
        await loadSharedJsonRetryQueue();
        const queue = readJsonRetryQueue();
        const existing = queue.find(candidate => queueKey(candidate) === queueKey({kind:writeData.target_tool || "checklist",sport:product.sport, bucket:writeData.target_bucket || product.target_bucket || product.year || "", code:product.code}));
        const item = Object.assign({}, existing || {}, {
          kind:writeData.target_tool || "checklist",
          product: product.display_name || "",
          code: product.code || "",
          sport: product.sport || "",
          bucket: writeData.target_bucket || product.target_bucket || product.year || "",
          queued_at: new Date().toISOString(),
          reason: detail || "Publish needs a status check."
        });
        const queueItemKey = queueKey(item);
        const next = queue.filter(existing => queueKey(existing) !== queueItemKey);
        next.unshift(item);
        const saved = await writeJsonRetryQueue(next.slice(0, 50), true, true);
        renderJsonRetryNotice();
        if (!saved) return;
        const scope = state.jsonQueueShared ? "shared queue" : "this device only";
        openPreviewModal("Future retry queued", item.product || item.code || "Checklist JSON publish", '<div class="guardrail">Sentinel saved this product for a future JSON publish retry in the ' + escapeHtml(scope) + '.</div>');
      }

      function getPublishError(data) {
        if (!data) return "Publish response was empty.";
        const publish = data.publish || {};
        const response = publish.response || {};
        const detail = publish.error || response.error || response.message || data.error || data.reason || data.next_step || publish.reason;
        if (detail) return detail;
        const github = publish.validation && publish.validation.github;
        if (github) return "GitHub verification did not pass: index " + (github.index_has_product ? "found" : "missing") + ", product rows " + Number(github.row_count || 0) + ", search rows " + Number(github.search_row_count || 0) + ".";
        return "Publish response needs review.";
      }

      function renderPublishFailure(writeData, attempt, detail, queuedItem, paused) {
        state.lastPublishError = detail || "Publish request failed.";
        const product = writeData && writeData.product ? writeData.product : {};
        const isDecision = paused || attempt === JSON_RETRY_DECISION_ATTEMPT;
        const isFinal = attempt >= JSON_RETRY_LIMIT;
        const attemptLabel = attempt === 1 ? "First attempt" : "Attempt " + attempt;
        const failureDetail = '<div class="guardrail" style="white-space:pre-wrap"><strong>Publish details:</strong> ' + escapeHtml(state.lastPublishError) + '</div>';
        const body = isFinal
          ? '<div class="guardrail">Fifth attempt failed. Do you want me to queue this for a future retry?</div><div class="actions"><button class="primary" type="button" data-queue-future-publish>Yes</button><button type="button" data-close-preview>No</button></div>'
          : isDecision
            ? '<div class="guardrail">' + (paused ? 'Automatic retries are paused because the write outcome needs verification. Check the publish details before starting another publish.' : 'Attempt 3 failed. Do you want to add this to the holding queue or make 2 more attempts?') + '</div><div class="actions"><button class="primary" type="button" data-queue-future-publish>Add to Queue</button><button type="button" data-two-more-publish>2 More Attempts</button></div>'
          : '<div class="guardrail">' + escapeHtml(attemptLabel) + ' failed. Requeueing another attempt in 30 seconds.</div><div class="status-line"><span class="dot working"></span><span id="publishCountdown">Retry ' + (attempt + 1) + ' of ' + JSON_RETRY_LIMIT + ' starts in 30s.</span></div>';
        openPreviewModal(paused ? "JSON publish status uncertain" : isFinal ? "JSON publish failed" : isDecision ? "JSON publish decision needed" : "JSON publish retry queued", product.display_name || product.code || "Checklist JSON publish", failureDetail + body);
        if (!isFinal && !isDecision) startPublishCountdown(writeData, attempt + 1, queuedItem);
      }

      function startPublishCountdown(writeData, nextAttempt, queuedItem) {
        if (state.publishTimer) clearInterval(state.publishTimer);
        let remaining = JSON_RETRY_DELAY_MS / 1000;
        state.publishTimer = setInterval(() => {
          remaining -= 1;
          const label = document.getElementById("publishCountdown");
          if (label) label.textContent = "Retry " + nextAttempt + " of " + JSON_RETRY_LIMIT + " starts in " + remaining + "s.";
          if (remaining <= 0) {
            clearInterval(state.publishTimer);
            state.publishTimer = null;
            publishJsonWithRetry(writeData, nextAttempt, queuedItem);
          }
        }, 1000);
      }

      function renderPublishSuccess(writeData, data, attempt, queuedItem) {
        const product = writeData && writeData.product ? writeData.product : {};
        const publish = data && data.publish ? data.publish : data || {};
        const validation = publish.validation || data && data.validation || {};
        const github = validation.github || {};
        const publicValidation = validation.public || {};
        const checklistVault = validation.checklist_vault || {};
        const chatbot = validation.chatbot || {};
        if (queuedItem && (!queuedItem.job_id || queuedItem.job_stage === "complete")) removeJsonRetryQueueItem(queuedItem);
        state.lastWriteData = writeData;
        const isPrv = writeData && writeData.target_tool === "prv";
        const visualButton = !isPrv && product.code && product.sport
          ? '<button class="primary" type="button" data-run-app-test>Run App Test</button>'
          : "";
        openPreviewModal("JSON Published", product.display_name || product.code || "Checklist JSON publish", `
          <div class="preview-meta">
            <span class="tag">Attempt: ${formatNumber(attempt)}</span>
            <span class="tag">GitHub publish: Complete</span>
            <span class="tag">GitHub rows: ${formatNumber(github.row_count || 0)}</span>
            <span class="tag">GitHub parallels: ${formatNumber(github.parallel_count || 0)}</span>
            <span class="tag">Public rows: ${formatNumber(publicValidation.row_count || 0)}</span>
            <span class="tag">Public parallels: ${formatNumber(publicValidation.parallel_count || 0)}</span>
            ${isPrv ? '<span class="tag">PRV public data: ' + (publicValidation.ok ? 'Verified' : 'Pending') + '</span>' : '<span class="tag">CV data: ' + (checklistVault.ok ? 'Verified' : 'Pending') + '</span><span class="tag">ChatBot data: ' + (chatbot.ok ? 'Verified' : 'Pending') + '</span>'}
          </div>
          <div class="guardrail">${escapeHtml(data && data.next_step || "Published. Public validation may still need the normal GitHub Pages soak window.")}</div>
          <div class="actions">${visualButton}</div>
        `);
      }

      function visualRunState(data) {
        const result = String(data && (data.result || data.conclusion || "") || "").toLowerCase();
        const status = String(data && data.status || "").toLowerCase();
        const note = String(data && data.note || "").toLowerCase();
        const hasRun = !!(data && (data.run_id || data.run_url || data.workflow_url || data.actions_url));
        if (result === "passed" || result === "success" || data && data.conclusion === "success") return "passed";
        if (result === "failed" || result === "failure" || data && data.conclusion === "failure") return "failed";
        if (status === "in_progress" || status === "running" || result === "running" || hasRun) return "running";
        if (note.includes("no matching github run") || note.includes("no github run") || note.includes("no matching run")) return "queued";
        return status === "queued" || result === "queued" ? "queued" : "queued";
      }

      function renderAppTestStatus(writeData, data, pollCount) {
        const product = writeData && writeData.product ? writeData.product : {};
        const stateLabel = visualRunState(data);
        const runUrl = data && (data.run_url || data.workflow_url || data.actions_url || data.html_url || data.url || "");
        const statusText = stateLabel === "passed"
          ? "CV / ChatBot visual test passed."
          : stateLabel === "failed"
            ? "CV / ChatBot visual test failed. Open the report and review screenshots/errors."
            : stateLabel === "running"
              ? "App test is running. Checking again in 15 seconds."
              : "App test was requested. Waiting for GitHub Actions to expose the run.";
        const statusClass = stateLabel === "passed" ? "ready" : stateLabel === "failed" ? "issue" : "working";
        const openLink = runUrl ? '<a href="' + escapeHtml(runUrl) + '" target="_blank" rel="noopener noreferrer">Open Report</a>' : "";

        openPreviewModal(stateLabel === "passed" ? "App test passed" : stateLabel === "failed" ? "App test failed" : "Running app test", product.display_name || product.code || "CV/ChatBot app test", `
          <div class="status-line"><span class="dot ${statusClass}"></span><span>${escapeHtml(statusText)}</span></div>
          <div class="preview-meta">
            <span class="tag">Status: ${escapeHtml(stateLabel)}</span>
            <span class="tag">Check: ${formatNumber(pollCount)}</span>
            <span class="tag">Code: ${escapeHtml(product.code || "")}</span>
            <span class="tag">Sport: ${escapeHtml(titleCase(product.sport || ""))}</span>
          </div>
          <div class="guardrail">${escapeHtml(data && data.note || data && data.result || "Waiting for test result.")}</div>
          <div class="actions">${openLink}<button type="button" data-refresh-app-test>Refresh Now</button></div>
        `);
      }

      function stopAppTestPolling() {
        if (state.appTestTimer) {
          clearTimeout(state.appTestTimer);
          state.appTestTimer = null;
        }
      }

      async function pollAppTestStatus(writeData, startedAt, pollCount) {
        const product = writeData && writeData.product ? writeData.product : {};
        const key = readOperatorKey();
        if (!key) return;
        try {
          const data = await postOperatorJson(DEFAULT_OPERATOR_URL, {
            action: "getVisualProductTestStatus",
            productName: product.display_name || product.name || product.code || "",
            sport: product.sport || "",
            code: product.code || "",
            startedAt: startedAt || "",
            key: key
          }, 60000);
          const stateLabel = visualRunState(data);
          renderAppTestStatus(writeData, data, pollCount);
          if ((stateLabel === "passed" || stateLabel === "failed")) {
            stopAppTestPolling();
            return;
          }
          if (pollCount >= APP_TEST_POLL_LIMIT) {
            stopAppTestPolling();
            openPreviewModal("App test still running", product.display_name || product.code || "CV/ChatBot app test", '<div class="guardrail">The test is still queued or running after several checks. Keep this page open and click Refresh Now, or open the Actions report if available.</div>');
            return;
          }
          state.appTestTimer = setTimeout(() => pollAppTestStatus(writeData, startedAt, pollCount + 1), APP_TEST_POLL_MS);
        } catch (err) {
          openPreviewModal("App test status failed", product.display_name || product.code || "CV/ChatBot app test", '<div class="guardrail">' + escapeHtml(err && err.message ? err.message : "Unable to read app test status.") + '</div><div class="actions"><button type="button" data-refresh-app-test>Refresh Now</button></div>');
        }
      }

      async function runAppTest(writeData) {
        const product = writeData && writeData.product ? writeData.product : {};
        const key = requireOperatorKey();
        if (!key || !product.code || !product.sport) {
          openPreviewModal("App test details missing", product.display_name || product.code || "CV/ChatBot app test", '<div class="guardrail">Sentinel needs product name, code, sport, and admin key before running the app test.</div>');
          return;
        }

        stopAppTestPolling();
        openPreviewModal("Running app test", product.display_name || product.code || "CV/ChatBot app test", '<div class="status-line"><span class="dot working"></span><span>Starting CV/ChatBot test now.</span></div>');
        try {
          const data = await postOperatorJson(DEFAULT_OPERATOR_URL, {
            action: "dispatchVisualProductTest",
            productName: product.display_name || product.name || product.code || "",
            sport: product.sport || "",
            code: product.code || "",
            key: key
          }, 60000);
          if (!data || !data.ok) {
            openPreviewModal("App test did not start", product.display_name || product.code || "CV/ChatBot app test", '<div class="guardrail">' + escapeHtml(data && (data.error || data.reason) || "Visual test request needs review.") + '</div>');
            return;
          }
          const startedAt = data.started_at || data.startedAt || new Date().toISOString();
          renderAppTestStatus(writeData, data, 0);
          state.appTestTimer = setTimeout(() => pollAppTestStatus(writeData, startedAt, 1), APP_TEST_POLL_MS);
        } catch (err) {
          openPreviewModal("App test failed to start", product.display_name || product.code || "CV/ChatBot app test", '<div class="guardrail">' + escapeHtml(err && err.message ? err.message : "Unknown backend response.") + '</div>');
        }
      }

      async function publishJsonWithRetry(writeData, attempt, queuedItem) {
        if (state.publishInFlight) return;
        const product = writeData && writeData.product || {};
        const key = requireOperatorKey();
        const bucket = writeData && (writeData.target_bucket || product.target_bucket || product.year || "");
        if (!key || !product.code || !product.sport || !bucket) return;
        state.publishInFlight = true;
        state.lastWriteData = writeData;
        let item;
        try {
          const target = {kind:writeData.target_tool || "checklist",sport:product.sport,bucket:bucket,code:product.code};
          item = queuedItem || readJsonRetryQueue().find(existing => queueKey(existing) === queueKey(target)) || target;
          item = Object.assign({}, item, {product:product.display_name || product.code,queued_at:item.queued_at || new Date().toISOString()});
          if (!item.request_id || item.job_stage === "failed") {
            item.request_id = typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "publish-" + Date.now() + "-" + Math.random().toString(36).slice(2);
            item.job_id = "";
            item.job_stage = "queued";
          }
          state.activeQueuedItem = item;
          // Persist the request identity before sending it, so a lost response
          // or closed browser resumes the same backend job instead of republishing.
          const save = async () => {
            item.updated_at = new Date().toISOString();
            const queue = readJsonRetryQueue().filter(existing => queueKey(existing) !== queueKey(item));
            writeLocalJsonRetryQueue([item].concat(queue));
            await writeJsonRetryQueue([item].concat(queue), false, true);
            renderJsonRetryNotice();
          };
          await save();
          for (let poll = 0; poll < 48; poll++) {
            openPreviewModal("Publishing JSON", product.display_name || product.code,
              '<div class="status-line"><span class="dot working"></span><span>' + escapeHtml(item.job_id ? "Job " + item.job_stage + ". Checking progress; uploads are not repeated." : "Submitting a saved publish job. Processing starts within about a minute.") + '</span></div><div class="guardrail">You can close this preview. The backend continues, and Resume / Verify in the holding queue reconnects to this job.</div>');
            const data = await postOperatorStep(item.kind === "prv" ? "publishPrvVaultStaticData" : "publishImportedChecklist", {sport:product.sport,bucket:bucket,code:product.code,key:key,
              async:"1",request_id:item.request_id,job_id:item.job_id || ""}, 90000, "Publish job status");
            const job = data && (data.job || data.publish && data.publish.job);
            if (!job) throw new Error(getPublishError(data));
            const changed = item.job_id !== job.id || item.job_stage !== job.stage;
            item.job_id = job.id;
            item.job_stage = job.stage;
            if (changed) await save();
            if (job.stage === "complete" || job.stage === "published_pages_pending") {
              renderPublishSuccess(writeData, data, attempt, item);
              return;
            }
            if (job.stage === "failed") {
              renderPublishFailure(writeData, attempt, getPublishError(data), item, true);
              return;
            }
            await new Promise(resolve => setTimeout(resolve, 5000));
            if (!els.previewModal.classList.contains("open")) return;
          }
          openPreviewModal("Publish job continues", product.display_name || product.code, '<div class="guardrail">The saved backend job continues independently. Use Resume / Verify in the holding queue to check progress.</div>');
        } catch (err) {
          renderPublishFailure(writeData, attempt, "The publish request needs a status check. Its saved request ID will be reused. " + String(err && err.message || err), item, true);
        } finally { state.publishInFlight = false; }
      }

      async function writePrvSource(sourceUrl, sport) {
        const key = requireOperatorKey();
        if (!key) return;
        openPreviewModal("Writing print-run data", "The source rows will be validated and saved with a recovery snapshot.", '<div class="status-line"><span class="dot working"></span><span>Writing PRV rows.</span></div>');
        try {
          const data = await postOperatorJson(DEFAULT_OPERATOR_URL,{action:"executePrvSourceImport",sourceUrl:sourceUrl,sport:sport,key:key},240000);
          if (data && data.ok) {
            data.target_tool="prv";
            data.source_validation=data.validation;
            data.validation={product_rows:data.source_validation.index_rows,checklist_rows:data.source_validation.product_rows,parallel_rows:0,ok:data.source_validation.ok};
          }
          renderWriteResult(data);
        } catch (err) { openPreviewModal("PRV import needs attention", "Check import status before retrying.", '<div class="guardrail">' + escapeHtml(String(err && err.message || err)) + '</div>'); }
      }

      async function writeChecklistSource(sourceUrl, sport) {
        const key = requireOperatorKey();
        if (!key) {
          openPreviewModal("Admin write key needed", "No sheet write was attempted.", '<div class="guardrail">Enter the admin write key to write this preview to Google Sheets.</div>');
          return;
        }

        openPreviewModal("Writing to Google Sheet", "The Operator Backend is updating the mapped source sheet and validating the result.", '<div class="status-line"><span class="dot working"></span><span>Writing sheet rows. JSON publish will not run yet.</span></div>');
        try {
          const data = await postOperatorJson(DEFAULT_OPERATOR_URL, {
            action: "executeSourceImport",
            sourceUrl: sourceUrl,
            sport: sport || "",
            key: key,
            publish: "0"
          }, 240000);
          renderWriteResult(data);
        } catch (err) {
          openPreviewModal("Import request failed", "No sheet write confirmation was received.", '<div class="guardrail">' + escapeHtml(err && err.message ? err.message : "Unknown backend response.") + '</div>');
        }
      }

      async function previewItem(type, index) {
        const list = type === "prv" ? state.prv : state.checklist;
        const item = list[Number(index)];
        const source = item && sourceFor(item);
        if (!item || !source) {
          openPreviewModal("Source URL missing", "No preview can be built for this item.", '<div class="guardrail">This source watch item did not include a source link.</div>');
          return;
        }

        openPreviewModal(type === "prv" ? "Building PRV preview" : "Building import preview", titleFor(item), '<div class="status-line"><span class="dot working"></span><span>Parsing source into preview rows.</span></div>');
        try {
          const action = type === "prv" ? "previewPrvSource" : "previewSourceImport";
          const data = await postOperatorJson(DEFAULT_OPERATOR_URL, {
            action: action,
            sourceUrl: source,
            sport: item.sport || ""
          }, 90000);
          renderPreviewModal(data, type);
        } catch (err) {
          openPreviewModal(type === "prv" ? "PRV preview failed" : "Import preview failed", titleFor(item), '<div class="guardrail">' + escapeHtml(err && err.message ? err.message : "Preview failed.") + '</div>');
        }
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function runSimpleAgentCycle() {
        const endpoint = DEFAULT_OPERATOR_URL;

        els.yesBtn.disabled = true;
        state.checklist = [];
        state.prv = [];
        state.prvScan = null;
        setTimedStatus("working", "Step 1 of 3: checking Operator Backend");
        els.resultsCard.classList.add("hidden");
        els.checklistCard.classList.add("hidden");
        els.prvCard.classList.add("hidden");

        try {
          const health = await checkOperator(endpoint);
          setTimedStatus("working", "Step 2 of 3: scanning missing checklist products");
          let checklistWarning = "";
          try {
          const checklistData = await postOperatorStep("sourceWatch", { mode: "quick_json" }, 90000, "Checklist source scan");
          if (!checklistData || !checklistData.ok || !Array.isArray(checklistData.items)) throw new Error(checklistData && checklistData.error || "Checklist source scan did not return valid results.");
          state.checklist = missingItems(checklistData);
          renderDiscoverySummary("Checklist scan complete. Print-run scan is still running.");
          } catch (err) { checklistWarning = String(err && err.message || err); }

          setTimedStatus("working", "Step 3 of 3: scanning missing print run products");
          const prvData = await postOperatorStep("prvSourceWatch", { mode: "quick_json" }, 90000, "Print-run source scan");
          if (!prvData || !prvData.ok || !Array.isArray(prvData.items)) throw new Error(prvData && prvData.error || "Print-run source scan did not return valid results.");
          state.prvScan = prvData;
          state.prv = actionablePrvItems(prvData);
          renderDiscoverySummary(checklistWarning ? "Checklist scan incomplete: " + checklistWarning : "");

          stopTimedStatus();
          setStatus(els.runStatus, checklistWarning ? "issue" : "ready", checklistWarning ? "Print-run scan complete. Checklist scan needs attention." : "Agent Cycle discovery complete.");
        } catch (err) {
          stopTimedStatus();
          setStatus(els.runStatus, "issue", err && err.message ? err.message : "Agent Cycle failed.");
        } finally {
          els.yesBtn.disabled = false;
        }
      }

      function animateWaiting() {
        let dots = 0;
        setInterval(() => {
          dots = dots === 3 ? 0 : dots + 1;
          if (els.waitingText && els.waitingText.textContent.indexOf("Waiting") === 0) {
            els.waitingText.textContent = "Waiting" + ".".repeat(dots);
          }
        }, 450);
      }

      function typeText(node, text, done) {
        let index = 0;
        node.classList.add("typing");
        const timer = setInterval(() => {
          node.textContent = text.slice(0, index + 1);
          index += 1;
          if (index >= text.length) {
            clearInterval(timer);
            node.classList.remove("typing");
            if (done) setTimeout(done, 180);
          }
        }, 34);
      }

      function startIntro() {
        typeText(els.welcomeText, "Welcome ChasingMajors Team.", () => {
          typeText(els.readyText, "Ready to run an Agent Cycle?", () => {
            els.introActions.classList.add("visible");
          });
        });
      }

      els.yesBtn.addEventListener("click", runSimpleAgentCycle);
      els.noBtn.addEventListener("click", () => {});
      els.previewModalClose.addEventListener("click", closePreviewModal);
      els.previewModal.addEventListener("click", event => {
        if (event.target === els.previewModal) closePreviewModal();
      });
      els.showJsonQueueBtn.addEventListener("click", handleJsonQueuePrompt);
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-preview-type]");
        if (!button) return;
        previewItem(button.dataset.previewType, button.dataset.previewIndex);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-ignore-type]");
        if (!button) return;
        ignoreProduct(button.dataset.ignoreType, button.dataset.ignoreIndex);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-write-checklist-source]");
        if (!button) return;
        writeChecklistSource(button.dataset.writeChecklistSource, button.dataset.writeChecklistSport || "");
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-write-prv-source]");
        if (button) writePrvSource(button.dataset.writePrvSource,button.dataset.writePrvSport || "");
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-publish-json]");
        if (!button) return;
        publishJsonWithRetry(state.lastWriteData, 1);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-queue-future-publish]");
        if (!button) return;
        queueFuturePublishRetry(state.lastWriteData, "Admin moved this to the holding queue after JSON publish retries failed. " + state.lastPublishError);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-two-more-publish]");
        if (!button) return;
        startPublishCountdown(state.lastWriteData, 4, state.activeQueuedItem);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-run-app-test]");
        if (!button) return;
        runAppTest(state.lastWriteData);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-refresh-app-test]");
        if (!button) return;
        pollAppTestStatus(state.lastWriteData, "", 1);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-update-json-key]");
        if (!button) return;
        const item = readJsonRetryQueue().find(entry => queueKey(entry) === button.dataset.updateJsonKey);
        if (!item) {
          openPreviewModal("Queued item missing", "This JSON retry item is no longer available.", '<div class="guardrail">Refresh the page and check the holding queue again.</div>');
          return;
        }
        const writeData = queuedWriteData(item);
        state.lastWriteData = writeData;
        publishJsonWithRetry(writeData, 1, item);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-close-preview]");
        if (!button) return;
        closePreviewModal();
      });
      els.showChecklistsBtn.addEventListener("click", () => {
        els.checklistCard.classList.toggle("hidden");
      });
      els.showPrvBtn.addEventListener("click", () => {
        els.prvCard.classList.toggle("hidden");
      });
      animateWaiting();
      clearLegacyPersistentOperatorKey();
      loadSharedJsonRetryQueue().then(() => {
        renderJsonRetryNotice();
      });
      startIntro();
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
