<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CM Sentinel Simple Agent</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --panel: #ffffff;
      --text: #111111;
      --muted: #555555;
      --border: #d7d7d7;
      --blue: #0b63ce;
      --green: #0f8f3d;
      --yellow: #9a6a00;
      --red: #b42318;
      --fade: 180ms ease;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    main {
      width: min(920px, calc(100% - 32px));
      margin: 48px auto;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 14px;
    }

    h1, h2, h3, p { margin-top: 0; }

    h1 {
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    h2 {
      font-size: 16px;
      margin-bottom: 8px;
    }

    h3 {
      font-size: 14px;
      margin-bottom: 6px;
    }

    p, label, input, button, li {
      font-size: 14px;
    }

    .muted {
      color: var(--muted);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 16px;
    }

    button {
      border: 1px solid #1f2937;
      border-radius: 4px;
      background: #ffffff;
      color: #111111;
      cursor: pointer;
      min-height: 38px;
      padding: 8px 14px;
      font-weight: 700;
    }

    button.primary {
      background: var(--blue);
      border-color: var(--blue);
      color: #ffffff;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }


    .status-line {
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      margin-top: 10px;
      min-height: 22px;
    }

    .intro-actions {
      opacity: 0;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity var(--fade), transform var(--fade);
    }

    .intro-actions.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--muted);
      flex: 0 0 auto;
      animation: softPulse 1.4s ease-in-out infinite;
    }

    .dot.ready { background: var(--green); }
    .dot.working { background: var(--yellow); }
    .dot.issue { background: var(--red); }

    .typing::after {
      content: "|";
      display: inline-block;
      margin-left: 2px;
      color: var(--muted);
      animation: caretBlink 800ms steps(1, end) infinite;
    }

    @keyframes caretBlink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }

    @keyframes softPulse {
      0%, 100% { transform: scale(1); opacity: 0.65; }
      50% { transform: scale(1.25); opacity: 1; }
    }

    .summary {
      border-left: 4px solid var(--blue);
      padding-left: 12px;
      margin-top: 12px;
      white-space: pre-line;
    }

    .hidden { display: none; }

    .list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .item {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 10px;
      background: #ffffff;
    }

    .item-title {
      font-weight: 700;
      margin-bottom: 4px;
    }

    .tag {
      display: inline-block;
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 2px 8px;
      margin: 4px 6px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      align-items: center;
      background: rgba(0, 0, 0, 0.48);
      display: none;
      justify-content: center;
      padding: 18px;
      z-index: 20;
    }

    .modal-backdrop.open { display: flex; }

    .modal {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      max-height: calc(100vh - 36px);
      overflow: auto;
      padding: 18px;
      width: min(820px, 100%);
    }

    .modal-top {
      align-items: flex-start;
      display: flex;
      gap: 12px;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-close {
      min-height: 32px;
      padding: 4px 10px;
    }

    .preview-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0 14px;
    }

    .preview-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr 1fr;
    }

    .preview-row {
      border-bottom: 1px solid var(--border);
      display: grid;
      gap: 8px;
      grid-template-columns: 54px 1fr 1fr;
      padding: 7px 0;
    }

    .preview-row em {
      color: var(--muted);
      font-style: normal;
      text-align: right;
    }

    .guardrail {
      background: #f7f7f7;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--muted);
      margin-top: 14px;
      padding: 10px;
    }

    a { color: var(--blue); }

    @media (max-width: 640px) {
      main {
        width: calc(100% - 20px);
        margin: 20px auto;
      }

      .actions {
        align-items: stretch;
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      .preview-grid {
        grid-template-columns: 1fr;
      }

      .preview-row {
        grid-template-columns: 42px 1fr;
      }

      .preview-row em {
        grid-column: 2;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card">
      <h1 id="welcomeText" aria-label="Welcome ChasingMajors Team."></h1>
      <p id="readyText" class="muted" aria-label="Ready to run an Agent Cycle?"></p>
      <div id="introActions" class="actions intro-actions">
        <button id="yesBtn" class="primary" type="button">Yes</button>
        <button id="noBtn" type="button">No</button>
      </div>
      <div id="runStatus" class="status-line">
        <span class="dot"></span>
        <span id="waitingText">Waiting</span>
      </div>
    </section>


    <section id="resultsCard" class="card hidden">
      <h2>Agent Cycle Results</h2>
      <div id="summary" class="summary"></div>
      <div class="actions">
        <button id="showChecklistsBtn" type="button">List Missing Checklist Product(s)</button>
        <button id="showPrvBtn" type="button">List Missing Print Run Product(s)</button>
      </div>
    </section>

    <section id="checklistCard" class="card hidden">
      <h2>Missing Checklist Product(s)</h2>
      <div id="checklistList" class="list"></div>
    </section>

    <section id="prvCard" class="card hidden">
      <h2>Missing Print Run Product(s)</h2>
      <div id="prvList" class="list"></div>
    </section>
  </main>

  <div id="previewModal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="previewModalTitle">
    <div class="modal">
      <div class="modal-top">
        <div>
          <h2 id="previewModalTitle">Import Preview</h2>
          <p id="previewModalSubtitle" class="muted"></p>
        </div>
        <button id="previewModalClose" class="modal-close" type="button">Close</button>
      </div>
      <div id="previewModalBody"></div>
    </div>
  </div>

  <script>
    (function () {
      const VERSION = "simple-agent-v1-2026-08-26";
      const DEFAULT_OPERATOR_URL = "https://script.google.com/macros/s/AKfycbyH90r_uVKKVyEUPAzQv65PlMC7j6LGYxq3s2HWAjBwkpTsLOo8U7KPhBWCD-6ExRjc/exec";
      const OPERATOR_WRITE_KEY = "cm_command_center_operator_write_key_v1";
      const SPORTS = ["baseball", "basketball", "football", "hockey", "soccer"];

      const state = {
        checklist: [],
        prv: []
      };

      const els = {
        yesBtn: document.getElementById("yesBtn"),
        noBtn: document.getElementById("noBtn"),
        welcomeText: document.getElementById("welcomeText"),
        readyText: document.getElementById("readyText"),
        introActions: document.getElementById("introActions"),
        runStatus: document.getElementById("runStatus"),
        waitingText: document.getElementById("waitingText"),
        resultsCard: document.getElementById("resultsCard"),
        summary: document.getElementById("summary"),
        showChecklistsBtn: document.getElementById("showChecklistsBtn"),
        showPrvBtn: document.getElementById("showPrvBtn"),
        checklistCard: document.getElementById("checklistCard"),
        prvCard: document.getElementById("prvCard"),
        checklistList: document.getElementById("checklistList"),
        prvList: document.getElementById("prvList"),
        previewModal: document.getElementById("previewModal"),
        previewModalTitle: document.getElementById("previewModalTitle"),
        previewModalSubtitle: document.getElementById("previewModalSubtitle"),
        previewModalBody: document.getElementById("previewModalBody"),
        previewModalClose: document.getElementById("previewModalClose")
      };

      function setStatus(node, kind, text) {
        const dot = node.querySelector(".dot");
        const label = node.querySelector("span:last-child");
        dot.className = "dot " + (kind || "");
        label.textContent = text;
      }

      function withQuery(endpoint, params) {
        const query = Object.keys(params).map(key => {
          return encodeURIComponent(key) + "=" + encodeURIComponent(params[key]);
        }).join("&");
        return endpoint + (endpoint.indexOf("?") > -1 ? "&" : "?") + query;
      }

      async function postOperatorJson(endpoint, payload, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs || 60000);
        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload || {}),
            signal: controller.signal
          });
          if (!response.ok) throw new Error(response.status + " " + response.statusText);
          return await response.json();
        } finally {
          clearTimeout(timer);
        }
      }

      function readOperatorKey() {
        try {
          return String(sessionStorage.getItem(OPERATOR_WRITE_KEY) || localStorage.getItem(OPERATOR_WRITE_KEY) || "").trim();
        } catch (err) {
          return "";
        }
      }

      function saveOperatorKey(key) {
        try {
          sessionStorage.setItem(OPERATOR_WRITE_KEY, String(key || "").trim());
        } catch (err) {}
      }

      function requireOperatorKey() {
        let key = readOperatorKey();
        if (key) return key;
        key = window.prompt("Enter admin write key");
        if (!key) return "";
        saveOperatorKey(key);
        return String(key).trim();
      }

      async function fetchJson(url, timeoutMs) {
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), timeoutMs || 60000);
        try {
          const response = await fetch(url, { cache: "no-store", signal: controller.signal });
          if (!response.ok) throw new Error(response.status + " " + response.statusText);
          return await response.json();
        } finally {
          clearTimeout(timer);
        }
      }

      async function checkOperator(endpoint) {
        const health = await fetchJson(withQuery(endpoint, { action: "health" }), 30000);
        if (!health || !health.ok || health.service !== "cm_command_center_operator") {
          throw new Error("This is not the Command Center Operator Backend.");
        }
        return health;
      }

      function actionableItems(data) {
        return (Array.isArray(data && data.items) ? data.items : []).filter(item => {
          return item && (
            item.status === "missing" ||
            item.status === "needs_review" ||
            item.status === "possible_update" ||
            item.status === "known_issue"
          );
        });
      }

      function missingItems(data) {
        return actionableItems(data).filter(item => item.status === "missing");
      }

      function sportCounts(items) {
        const counts = {};
        SPORTS.forEach(sport => counts[sport] = 0);
        items.forEach(item => {
          const sport = String(item.sport || "").toLowerCase();
          if (counts[sport] !== undefined) counts[sport] += 1;
        });
        return counts;
      }

      function formatNumber(value) {
        const number = Number(value || 0);
        return Number.isFinite(number) ? number.toLocaleString() : "0";
      }

      function titleCase(value) {
        return String(value || "").replace(/_/g, " ").replace(/\b\w/g, char => char.toUpperCase());
      }

      function countSentence(counts) {
        const parts = SPORTS.filter(sport => counts[sport]).map(sport => {
          return counts[sport] + " " + sport;
        });
        if (!parts.length) return "0 products";
        if (parts.length === 1) return parts[0] + " product(s)";
        return parts.slice(0, -1).join(", ") + ", and " + parts[parts.length - 1] + " product(s)";
      }

      function titleFor(item) {
        return item.matched_name || item.title || item.product || "Untitled product";
      }

      function sourceFor(item) {
        return item.source_url || item.url || "";
      }

      function previewButtonFor(item, type, index) {
        if (!sourceFor(item)) return "";
        const label = type === "prv" ? "PRV Preview" : "Preview Ready";
        return '<button type="button" data-preview-type="' + escapeHtml(type) + '" data-preview-index="' + escapeHtml(index) + '">' + label + '</button>';
      }

      function renderList(node, items, heading, type) {
        if (!items.length) {
          node.innerHTML = '<div class="item"><div class="item-title">No missing products found.</div><div class="muted">This lane is clear.</div></div>';
          return;
        }

        node.innerHTML = items.map((item, index) => {
          const source = sourceFor(item);
          return `
            <div class="item">
              <h3>${heading}</h3>
              <div class="item-title">${escapeHtml(titleFor(item))}</div>
              <div class="muted">${escapeHtml(item.reason || item.recommended_action || "Needs review before any database write.")}</div>
              <span class="tag">${escapeHtml(item.sport || "unknown sport")}</span>
              <span class="tag">${escapeHtml(item.status || "review")}</span>
              <div class="item-actions">
                ${previewButtonFor(item, type, index)}
                ${source ? `<a href="${escapeHtml(source)}" target="_blank" rel="noopener noreferrer">Source</a>` : ""}
              </div>
            </div>
          `;
        }).join("");
      }

      function openPreviewModal(title, subtitle, bodyHtml) {
        els.previewModalTitle.textContent = title || "Import Preview";
        els.previewModalSubtitle.textContent = subtitle || "";
        els.previewModalBody.innerHTML = bodyHtml || "";
        els.previewModal.classList.add("open");
      }

      function closePreviewModal() {
        els.previewModal.classList.remove("open");
      }

      function renderPreviewRows(rows, type) {
        if (!rows.length) return '<p class="muted">No sample rows parsed.</p>';
        return rows.map(row => {
          if (type === "prv") {
            const printRun = row.printRun ? "~" + formatNumber(row.printRun) : row.serial_no || "";
            return '<div class="preview-row"><strong>' + escapeHtml(row.setType || "") + '</strong><span>' + escapeHtml(row.setLine || row.name || "") + '</span><em>' + escapeHtml(printRun) + '</em></div>';
          }
          return '<div class="preview-row"><strong>' + escapeHtml(row.card_no || "") + '</strong><span>' + escapeHtml(row.player || row.name || "") + '</span><em>' + escapeHtml(row.team || "") + '</em></div>';
        }).join("");
      }

      function renderPreviewParallels(rows) {
        if (!rows.length) return '<p class="muted">No sample parallels parsed.</p>';
        return rows.map(row => {
          return '<div class="preview-row"><strong>' + escapeHtml(row.parallel_name || row.name || "") + '</strong><span>' + escapeHtml(row.applies_to_subset || row.subset || "") + '</span><em>' + escapeHtml(row.serial_no || row.printRun || "") + '</em></div>';
        }).join("");
      }

      function renderPreviewModal(data, type) {
        if (!data || (!data.ok && data.status !== "preview_ready")) {
          const title = type === "prv" ? "PRV Parser Review Needed" : "Import Preview Failed";
          const detail = data && (data.error || data.reason) || "Unknown backend response.";
          openPreviewModal(title, "Backend did not return a writable preview.", '<div class="guardrail">' + escapeHtml(detail) + '</div>');
          return;
        }

        const product = data.product || {};
        const sampleRows = Array.isArray(data.sample_rows) ? data.sample_rows : [];
        const sampleParallels = Array.isArray(data.sample_parallels) ? data.sample_parallels : [];
        const hasRows = Number(data.row_count || 0) > 0;
        const title = type === "prv"
          ? hasRows ? "PRV Source Preview" : "PRV Parser Review Needed"
          : "Import Preview";
        const rightColumn = type === "prv"
          ? '<p>' + escapeHtml(hasRows ? data.next_step || "Review these rows before writing PRV temp data." : "Parser review is needed before this can write PRV sheet data.") + '</p>'
          : renderPreviewParallels(sampleParallels);
        const checklistMeta = type === "checklist"
          ? '<span class="tag">Parallels: ' + formatNumber(data.parallel_count || 0) + '</span><span class="tag">Target: ' + escapeHtml(product.target_bucket || "") + '</span>'
          : "";
        const writeLabel = type === "prv" ? "Write PRV Temp Data" : "Write to Google Sheet";
        const guardrail = type === "prv"
          ? "Review the sample rows before writing. This trial page does not write PRV temp data yet."
          : "Review the sample rows before writing. This action updates matching rows for this product code and appends new rows. It does not delete unrelated sheet data.";
        const writeButton = type === "checklist" && data.status === "preview_ready" && data.source_url
          ? '<button class="primary" type="button" data-write-checklist-source="' + escapeHtml(data.source_url || "") + '" data-write-checklist-sport="' + escapeHtml(product.sport || "") + '">Write to Google Sheet</button>'
          : '<button type="button" disabled>' + escapeHtml(writeLabel) + '</button>';

        openPreviewModal(title, product.display_name || "Untitled product", `
          <div class="preview-meta">
            <span class="tag">${escapeHtml(String(data.status || "preview").toUpperCase())}</span>
            <span class="tag">Code: ${escapeHtml(product.code || "")}</span>
            <span class="tag">Sport: ${escapeHtml(titleCase(product.sport || ""))}</span>
            <span class="tag">Year: ${escapeHtml(product.year || "")}</span>
            <span class="tag">Rows: ${formatNumber(data.row_count || 0)}</span>
            ${checklistMeta}
          </div>
          <div class="preview-grid">
            <div>
              <h3>${type === "prv" ? "Sample PRV Rows" : "Sample Rows"}</h3>
              ${renderPreviewRows(sampleRows, type)}
            </div>
            <div>
              <h3>${type === "prv" ? "Next Step" : "Sample Parallels"}</h3>
              ${rightColumn}
            </div>
          </div>
          <div class="guardrail">${escapeHtml(guardrail)}</div>
          <div class="actions">${writeButton}</div>
        `);
      }

      function renderWriteResult(data) {
        if (!data || !data.ok) {
          const preview = data && data.preview ? data.preview : {};
          const detail = data && data.error ? data.error : "Unknown backend response.";
          openPreviewModal("Import blocked before sheet write", preview.product && preview.product.display_name ? preview.product.display_name : "No sheet write was made.", '<div class="guardrail">' + escapeHtml(detail) + '</div>');
          return;
        }

        const product = data.product || {};
        const validation = data.validation || {};
        openPreviewModal("Google Sheet Updated", product.display_name || "Untitled product", `
          <div class="preview-meta">
            <span class="tag">REVIEW</span>
            <span class="tag">Target: ${escapeHtml(data.target_bucket || product.target_bucket || product.year || "")}</span>
            <span class="tag">Product rows: ${formatNumber(validation.product_rows || 0)}</span>
            <span class="tag">Checklist rows: ${formatNumber(validation.checklist_rows || 0)}</span>
            <span class="tag">Parallels: ${formatNumber(validation.parallel_rows || 0)}</span>
            <span class="tag">GitHub publish: Not started</span>
            <span class="tag">GitHub rows: 0</span>
            <span class="tag">GitHub parallels: 0</span>
            <span class="tag">Public rows: 0</span>
            <span class="tag">Public parallels: 0</span>
            <span class="tag">CV: Review</span>
            <span class="tag">ChatBot: Review</span>
          </div>
          <div class="guardrail">Sheet write succeeded. JSON publish is intentionally waiting for the soak window before validation.</div>
        `);
      }

      async function writeChecklistSource(sourceUrl, sport) {
        const key = requireOperatorKey();
        if (!key) {
          openPreviewModal("Admin write key needed", "No sheet write was attempted.", '<div class="guardrail">Enter the admin write key to write this preview to Google Sheets.</div>');
          return;
        }

        openPreviewModal("Writing to Google Sheet", "The Operator Backend is updating the mapped source sheet and validating the result.", '<div class="status-line"><span class="dot working"></span><span>Writing sheet rows. JSON publish will not run yet.</span></div>');
        try {
          const data = await postOperatorJson(DEFAULT_OPERATOR_URL, {
            action: "executeSourceImport",
            sourceUrl: sourceUrl,
            sport: sport || "",
            key: key,
            publish: "0"
          }, 240000);
          renderWriteResult(data);
        } catch (err) {
          openPreviewModal("Import request failed", "No sheet write confirmation was received.", '<div class="guardrail">' + escapeHtml(err && err.message ? err.message : "Unknown backend response.") + '</div>');
        }
      }

      async function previewItem(type, index) {
        const list = type === "prv" ? state.prv : state.checklist;
        const item = list[Number(index)];
        const source = item && sourceFor(item);
        if (!item || !source) {
          openPreviewModal("Source URL missing", "No preview can be built for this item.", '<div class="guardrail">This source watch item did not include a source link.</div>');
          return;
        }

        openPreviewModal(type === "prv" ? "Building PRV preview" : "Building import preview", titleFor(item), '<div class="status-line"><span class="dot working"></span><span>Parsing source into preview rows.</span></div>');
        try {
          const action = type === "prv" ? "previewPrvSource" : "previewSourceImport";
          const data = await fetchJson(withQuery(DEFAULT_OPERATOR_URL, {
            action: action,
            sourceUrl: source,
            sport: item.sport || ""
          }), 90000);
          renderPreviewModal(data, type);
        } catch (err) {
          openPreviewModal(type === "prv" ? "PRV preview failed" : "Import preview failed", titleFor(item), '<div class="guardrail">' + escapeHtml(err && err.message ? err.message : "Preview failed.") + '</div>');
        }
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      async function runSimpleAgentCycle() {
        const endpoint = DEFAULT_OPERATOR_URL;

        els.yesBtn.disabled = true;
        setStatus(els.runStatus, "working", "Running checklist and print run checks.");
        els.resultsCard.classList.add("hidden");
        els.checklistCard.classList.add("hidden");
        els.prvCard.classList.add("hidden");

        try {
          const health = await checkOperator(endpoint);
          const checklistUrl = withQuery(endpoint, { action: "sourceWatch", mode: "quick_json" });
          const prvUrl = withQuery(endpoint, { action: "prvSourceWatch", mode: "quick_json" });
          const results = await Promise.all([
            fetchJson(checklistUrl, 90000),
            fetchJson(prvUrl, 90000)
          ]);

          state.checklist = missingItems(results[0]);
          state.prv = missingItems(results[1]);

          const checklistCounts = sportCounts(state.checklist);
          const prvCounts = sportCounts(state.prv);
          const checklistTotal = state.checklist.length;
          const prvTotal = state.prv.length;

          els.summary.textContent =
            "I found " + checklistTotal + " missing checklist product(s) and " + prvTotal + " missing print run product(s) that need added to the database.\n" +
            "Checklist: " + countSentence(checklistCounts) + " missing from the checklist tables.\n" +
            "Print Runs: " + countSentence(prvCounts) + " missing from the print run files.";

          renderList(els.checklistList, state.checklist, "NEW CHECKLIST FOUND - SOURCE IMPORT", "checklist");
          renderList(els.prvList, state.prv, "NEW PRINT RUN FOUND - PRV REVIEW", "prv");
          els.resultsCard.classList.remove("hidden");
          setStatus(els.runStatus, "ready", "Agent Cycle discovery complete.");
        } catch (err) {
          setStatus(els.runStatus, "issue", err && err.message ? err.message : "Agent Cycle failed.");
        } finally {
          els.yesBtn.disabled = false;
        }
      }

      function animateWaiting() {
        let dots = 0;
        setInterval(() => {
          dots = dots === 3 ? 0 : dots + 1;
          if (els.waitingText && els.waitingText.textContent.indexOf("Waiting") === 0) {
            els.waitingText.textContent = "Waiting" + ".".repeat(dots);
          }
        }, 450);
      }

      function typeText(node, text, done) {
        let index = 0;
        node.classList.add("typing");
        const timer = setInterval(() => {
          node.textContent = text.slice(0, index + 1);
          index += 1;
          if (index >= text.length) {
            clearInterval(timer);
            node.classList.remove("typing");
            if (done) setTimeout(done, 180);
          }
        }, 34);
      }

      function startIntro() {
        typeText(els.welcomeText, "Welcome ChasingMajors Team.", () => {
          typeText(els.readyText, "Ready to run an Agent Cycle?", () => {
            els.introActions.classList.add("visible");
          });
        });
      }

      els.yesBtn.addEventListener("click", runSimpleAgentCycle);
      els.noBtn.addEventListener("click", () => {});
      els.previewModalClose.addEventListener("click", closePreviewModal);
      els.previewModal.addEventListener("click", event => {
        if (event.target === els.previewModal) closePreviewModal();
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-preview-type]");
        if (!button) return;
        previewItem(button.dataset.previewType, button.dataset.previewIndex);
      });
      document.addEventListener("click", event => {
        const button = event.target.closest("[data-write-checklist-source]");
        if (!button) return;
        writeChecklistSource(button.dataset.writeChecklistSource, button.dataset.writeChecklistSport || "");
      });
      els.showChecklistsBtn.addEventListener("click", () => {
        els.checklistCard.classList.toggle("hidden");
      });
      els.showPrvBtn.addEventListener("click", () => {
        els.prvCard.classList.toggle("hidden");
      });
      animateWaiting();
      startIntro();
    })();
  </script>
</body>
</html>
